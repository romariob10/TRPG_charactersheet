name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/romariob10/trpg-charactersheet-web
  API_IMAGE: ghcr.io/romariob10/trpg-charactersheet-api
  WORKER_IMAGE: ghcr.io/romariob10/trpg-charactersheet-worker

jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Verify the current main commit passed CI
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const source = context.payload.workflow_run;
            const sha = context.eventName === 'workflow_run' ? source.head_sha : context.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error('Deployment requires a full commit SHA.');
            }

            const { data: main } = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/main',
            });
            if (main.object.sha !== sha) {
              throw new Error('Main has advanced; deploy its current successful CI run.');
            }

            // Do not accept an older successful run when the latest run failed or is pending.
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              head_sha: sha,
              per_page: 100,
            });
            const latest = data.workflow_runs.sort((a, b) => b.run_number - a.run_number)[0];
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (!latest || latest.head_sha !== sha || latest.head_branch !== 'main' ||
                latest.event !== 'push' || latest.head_repository?.full_name !== repository ||
                latest.status !== 'completed' || latest.conclusion !== 'success' ||
                (source && source.id !== latest.id)) {
              throw new Error('The latest CI push run for this main commit must succeed.');
            }
            core.setOutput('sha', sha);

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          target: production
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:main
            ${{ env.WEB_IMAGE }}:sha-${{ needs.verify.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          target: api-production
          push: true
          tags: |
            ${{ env.API_IMAGE }}:main
            ${{ env.API_IMAGE }}:sha-${{ needs.verify.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          target: worker-production
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:main
            ${{ env.WORKER_IMAGE }}:sha-${{ needs.verify.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    runs-on: [self-hosted, rodev]
    needs: [verify, build]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_SHA: ${{ needs.verify.outputs.sha }}
      MYCHARACTER_IMAGE_TAG: sha-${{ needs.verify.outputs.sha }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync production checkout
        working-directory: /home/user/mycharacter
        run: |
          if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "Production checkout has local changes; refusing to overwrite them." >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$DEPLOY_SHA" ]; then
            echo "Main has advanced; refusing an outdated deployment." >&2
            exit 1
          fi
          git checkout --detach "$DEPLOY_SHA"
      - name: Pull and start production
        working-directory: /home/user/mycharacter
        run: |
          docker compose --env-file .env.prod -f compose.prod.yaml pull web api worker migrate
          git fetch origin main:refs/remotes/origin/main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$DEPLOY_SHA" ]; then
            echo "Main has advanced; refusing an outdated deployment." >&2
            exit 1
          fi
          docker compose --env-file .env.prod -f compose.prod.yaml up -d --no-build --remove-orphans --wait --wait-timeout 180
          docker compose --env-file .env.prod -f compose.prod.yaml ps

      # Rollback from /home/user/mycharacter by replacing <prev> with a retained
      # full commit SHA, then verify health with `docker compose -f compose.prod.yaml ps`.
      # Confirm database compatibility before rolling back application images:
      # MYCHARACTER_IMAGE_TAG=sha-<prev> docker compose --env-file .env.prod -f compose.prod.yaml pull web api worker
      # MYCHARACTER_IMAGE_TAG=sha-<prev> docker compose --env-file .env.prod -f compose.prod.yaml up -d --no-deps web api worker
